---
# yamllint disable rule:line-length
name: Release

"on":
  push:
    branches:
      - main
    paths:
      - custom_components/actronair_neo/manifest.json
    tags:
      - "[0-9]*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  auto_tag:
    name: Tag release on manifest change
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/heads/')
    permissions:
      contents: write
    outputs:
      tag_created: ${{ steps.create_tag.outputs.created || 'false' }}
      version: ${{ steps.manifest.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Read version from manifest
        id: manifest
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('custom_components/actronair_neo/manifest.json'))['version'])")

          if [ -z "$VERSION" ]; then
            echo "Version not found in manifest.json"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Manifest version: $VERSION"

      - name: Check if tag already exists
        id: check_tag
        run: |
          TAG="${{ steps.manifest.outputs.version }}"

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists (local)"
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists (remote)"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG does not exist"
          fi

      - name: Create and push tag
        id: create_tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          TAG="${{ steps.manifest.outputs.version }}"
          echo "Creating tag $TAG"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          TAG="${{ steps.manifest.outputs.version }}"
          if [ "${{ steps.check_tag.outputs.exists }}" = "true" ]; then
            echo "Tag $TAG already existed. No new tag created." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Created and pushed tag $TAG from manifest.json version." >> "$GITHUB_STEP_SUMMARY"
            echo "Release job will run next in this workflow." >> "$GITHUB_STEP_SUMMARY"
          fi

  release:
    name: Build and Release
    runs-on: ubuntu-latest
    needs: auto_tag
    permissions:
      contents: write
      id-token: write
      attestations: write
    # Run when: (1) triggered directly by a tag push, OR
    # (2) auto_tag just created a new tag in this workflow run, OR
    # (3) manually triggered via workflow_dispatch.
    # always() is needed so the job evaluates even when auto_tag is skipped.
    if: >-
      always() && !cancelled() &&
      (startsWith(github.ref, 'refs/tags/') ||
       needs.auto_tag.outputs.tag_created == 'true' ||
       github.event_name == 'workflow_dispatch')

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          # Determine version from tag ref (direct tag push) or auto_tag output
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION="${{ needs.auto_tag.outputs.version }}"
          fi

          if [ -z "$VERSION" ]; then
            echo "ERROR: Could not determine version"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

          # Check if this is a pre-release
          if [[ "$VERSION" =~ (alpha|beta|rc) ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "This is a pre-release"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "This is a stable release"
          fi

      - name: Verify manifest.json version matches
        run: |
          MANIFEST_VERSION=$(python3 -c "import json; print(json.load(open('custom_components/actronair_neo/manifest.json'))['version'])")
          TAG_VERSION="${{ steps.version.outputs.version }}"

          if [ "$MANIFEST_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: manifest.json version ($MANIFEST_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

          echo "✅ manifest.json version matches tag: $TAG_VERSION"

      - name: Build release package
        id: build
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PACKAGE_FILE="actronair_neo-${VERSION}.zip"

          cd custom_components
          zip -r "../${PACKAGE_FILE}" actronair_neo/ \
            -x "*.pyc" \
            -x "*__pycache__*" \
            -x "*.git*" \
            -x "*.DS_Store"
          cd ..

          if [ ! -f "$PACKAGE_FILE" ]; then
            echo "ERROR: Package file not found: $PACKAGE_FILE"
            exit 1
          fi

          SHA256=$(sha256sum "$PACKAGE_FILE" | awk '{print $1}')
          echo "${SHA256}  ${PACKAGE_FILE}" > SHA256SUM

          echo "package=$PACKAGE_FILE" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

          echo "✅ Package: $PACKAGE_FILE ($(du -h "$PACKAGE_FILE" | cut -f1))"
          echo "✅ SHA256: $SHA256"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4
        with:
          subject-path: ${{ steps.build.outputs.package }}

      - name: Build release notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA256="${{ steps.build.outputs.sha256 }}"
          PACKAGE="${{ steps.build.outputs.package }}"
          REPO="${{ github.repository }}"

          # Extract version-specific notes from CHANGELOG.md
          NOTES=""
          if [ -f "CHANGELOG.md" ] && grep -q "\[$VERSION\]" CHANGELOG.md; then
            NOTES=$(awk "/^## \[$VERSION\]/{found=1; next} found && /^## \[/{exit} found" CHANGELOG.md | sed '/^$/N;/^\n$/d')
          fi

          if [ -z "$NOTES" ]; then
            NOTES="Release ${VERSION} of the ActronAir Neo Home Assistant integration."
          fi

          # Assemble RELEASE_NOTES.md using a heredoc
          cat > RELEASE_NOTES.md << EOF
          ${NOTES}

          See [CHANGELOG.md](https://github.com/${REPO}/blob/main/CHANGELOG.md) for full changelog.

          ---

          ## 📦 Installation

          ### Via HACS (Recommended)

          1. Open HACS in Home Assistant
          2. Go to **Integrations**
          3. Click the **⋮** menu → **Custom repositories**
          4. Add this repository: \`https://github.com/${REPO}\`
          5. Category: **Integration**
          6. Click **Add**
          7. Search for **ActronAir Neo**
          8. Click **Download**
          9. Restart Home Assistant

          ### Manual Installation

          1. Download \`${PACKAGE}\`
          2. Extract to \`config/custom_components/\`
          3. Restart Home Assistant
          4. Add the integration via **Settings** → **Devices & Services** → **Add Integration**

          ---

          **SHA256 Checksum:**
          \`\`\`
          ${SHA256}  ${PACKAGE}
          \`\`\`
          EOF

          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          PRERELEASE_FLAG=""
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          # shellcheck disable=SC2086
          gh release create "${VERSION}" \
            "${{ steps.build.outputs.package }}" \
            SHA256SUM \
            CHANGELOG.md \
            --title "${VERSION}" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag \
            $PRERELEASE_FLAG

      - name: Release Summary
        if: always()
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          if [ "${{ job.status }}" = "success" ]; then
            cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## 🎉 ${VERSION} Released Successfully!

          **Package:** \`${{ steps.build.outputs.package }}\`

          **SHA256:** \`${{ steps.build.outputs.sha256 }}\`

          **Release:** https://github.com/${{ github.repository }}/releases/tag/${VERSION}

          **Type:** ${{ steps.version.outputs.prerelease == 'true' && 'Pre-release' || 'Stable release' }}

          ### 📋 Next Steps

          - ✅ Release created and package uploaded
          - ✅ Build provenance attestation recorded
          - ✅ HACS users can now update to ${VERSION}
          - ✅ Manual installation package available for download
          EOF
          else
            cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## ❌ ${VERSION} Release Failed

          The release workflow did not complete successfully.
          Check the job logs above for details.

          **Status:** ${{ job.status }}
          EOF
          fi
