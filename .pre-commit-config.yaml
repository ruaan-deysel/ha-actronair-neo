# Based on Home Assistant Core pre-commit configuration
# Adapted for custom integration
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.13
    hooks:
      - id: ruff-check
        args:
          - --fix
        files: ^(custom_components|tests)/.+\.py$
      - id: ruff-format
        files: ^(custom_components|tests)/.+\.py$
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        args:
          - --ignore-words-list=hass,actronair
          - --skip=./.*,*.csv,*.json,*.ambr
          - --quiet-level=2
        exclude_types: [csv, json, html]
        exclude: ^(tests/fixtures/|utils/)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-executables-have-shebangs
        stages: [manual]
      - id: check-json
        exclude: (.vscode|.devcontainer)
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.37.1
    hooks:
      - id: yamllint
        args:
          - -d
          - |
            extends: default
            rules:
              line-length: disable
              document-start: disable
              truthy:
                check-keys: false
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.6.2
    hooks:
      - id: prettier
        additional_dependencies:
          - prettier@3.6.2
          - prettier-plugin-sort-json@4.2.0
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        require_serial: true
        types: [python]
        files: ^custom_components/.+\.py$
        args:
          - --ignore-missing-imports
          - --no-site-packages
      - id: pylint
        name: pylint
        entry: pylint
        language: system
        require_serial: true
        types: [python]
        files: ^(custom_components|tests)/.+\.py$
        args:
          - --disable=all
          - --enable=unused-import,undefined-variable,trailing-whitespace
