[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-actronair-neo"
version = "2025.12.0"
description = "Home Assistant integration for ActronAir Neo"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.14.2"
authors = [
    {name = "Ruaan Deysel", email = "ruaan@example.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "aiofiles",
    "aiomqtt>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "homeassistant>=2026.5.4,<2027",
    "colorlog>=6.0.0",
    "pre-commit>=3.6.0",
    "pyright>=1.1.400",
    "ruff>=0.8.0",
    "mypy>=1.8.0",
    "codespell>=2.2.0",
]
test = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-homeassistant-custom-component>=0.13.0",
    "pytest-timeout>=2.2.0",
    "pytest-xdist>=3.5.0",
    "freezegun>=1.2.0",
    "respx>=0.20.0",
    "syrupy>=4.6.0",
    "types-aiofiles>=25.1.0.20260409",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["custom_components*"]

[tool.uv]
# uv will read .python-version (3.14.2) and create .venv automatically.
# Install everything: uv sync --all-extras
python-preference = "managed"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git", "custom_components"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
]
addopts = [
    "--strict-markers",
    "-ra",
    "-v",
]

[tool.coverage.run]
branch = true
source = ["custom_components/actronair_neo"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/climate.py",  # Entity platform - requires full HA integration testing
    "*/sensor.py",  # Entity platform - requires full HA integration testing
    "*/binary_sensor.py",  # Entity platform - requires full HA integration testing
    "*/switch.py",  # Entity platform - requires full HA integration testing
    "*/number.py",  # Entity platform - requires full HA integration testing
    "*/api.py",  # Deprecated - replaced by api_wrapper.py
    "*/diagnostics.py",  # Optional diagnostics feature
    "*/repairs.py",  # Optional repairs/health monitoring feature
    "*/__init__.py",  # Integration setup - requires full HA integration testing
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@abstractmethod",
]
fail_under = 64  # Achieved coverage for core business logic (entity platforms excluded)
show_missing = true
precision = 2

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "A",      # flake8-builtins
    "ASYNC",  # flake8-async
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "D",      # pydocstyle
    "DTZ",    # flake8-datetimez
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "FA",     # flake8-future-annotations
    "FLY",    # flynt
    "G",      # flake8-logging-format
    "I",      # isort
    "ICN",    # flake8-import-conventions
    "INT",    # flake8-gettext
    "ISC",    # flake8-implicit-str-concat
    "LOG",    # flake8-logging
    "N",      # pep8-naming
    "PERF",   # perflint
    "PGH",    # pygrep-hooks
    "PIE",    # flake8-pie
    "PL",     # pylint
    "PT",     # flake8-pytest-style
    "PTH",    # flake8-use-pathlib
    "PYI",    # flake8-pyi
    "RET",    # flake8-return
    "RSE",    # flake8-raise
    "RUF",    # ruff-specific
    "S",      # flake8-bandit
    "SIM",    # flake8-simplify
    "SLF",    # flake8-self
    "SLOT",   # flake8-slots
    "T10",    # flake8-debugger
    "T20",    # flake8-print
    "TCH",    # flake8-type-checking
    "TID",    # flake8-tidy-imports
    "TRY",    # tryceratops
    "UP",     # pyupgrade
    "W",      # pycodestyle warnings
    "YTT",    # flake8-2020
]

ignore = [
    "D100",   # Missing docstring in public module
    "D104",   # Missing docstring in public package
    "D107",   # Missing docstring in __init__
    "D203",   # no-blank-line-before-class (conflicts with D211)
    "D213",   # multi-line-summary-second-line (conflicts with D212)
    "PLR0913", # Too many arguments
    "PLR2004", # Magic value used in comparison
    "S101",   # Use of assert (needed for tests)
    "TRY003", # Avoid specifying long messages outside exception class
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "D",       # Ignore docstrings in tests
    "S101",    # Assert is fine in tests
    "S105",    # Hardcoded passwords are fine in tests (test values)
    "SLF001",  # Private member access is fine in tests
    "PLR2004", # Magic values are fine in tests
    "ARG",     # Unused arguments are fine in tests (fixtures)
    "FBT",     # Boolean args are fine in tests
    "PLC0415", # Import not at top level is fine in tests for mocking
    "TC002",   # Type checking imports are fine in tests
    "TC003",   # Type checking imports are fine in tests
    "E501",    # Line too long is fine in tests
]
"custom_components/*" = [
    "PGH003",  # Ignore specific type ignore codes for HA imports
    "TRY401",  # Redundant exception in logging (HA style)
    "C901",    # Function complexity (some HA integrations are complex)
    "PLR0915", # Too many statements (HA integrations can be complex)
    "EXE002",  # Executable files without shebang
]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.actronair_neo"]
combine-as-imports = true

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.pylint]
max-args = 10
max-branches = 25
max-returns = 10
max-statements = 50

[tool.mypy]
python_version = "3.14"
show_error_codes = true
follow_imports = "silent"
local_partial_types = true
strict_equality = true
warn_incomplete_stub = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
enable_error_code = ["ignore-without-code", "redundant-self", "truthy-iterable"]
disable_error_code = ["annotation-unchecked", "import-not-found", "import-untyped", "misc", "no-any-return", "no-untyped-def", "unused-ignore"]
extra_checks = false
check_untyped_defs = false
disallow_incomplete_defs = false
disallow_subclassing_any = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_untyped_defs = false
warn_return_any = false
warn_unreachable = true
exclude = [
    "venv/",
    ".venv/",
    "build/",
    "dist/",
    ".eggs/",
    "utils/",
]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.codespell]
ignore-words-list = "hass,actronair"
skip = "*.json,*.lock"
quiet-level = 2
